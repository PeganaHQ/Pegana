name: Web E2E (Playwright)

# Tests the exact deployed Vercel target and the backend configured into that
# deployment. No frontend or backend services are started on the CI runner.
# Deterministic-fixture assumptions remain blocking and surface as failures.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Deployed Vercel URL to test (HTTPS origin only)"
        required: true
        type: string
      candidate_sha:
        description: "Exact 40-character Git SHA deployed to Vercel"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Deployed target (Chromium full suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_EXTERNAL_TARGET: "1"
      PLAYWRIGHT_BASE_URL: ${{ inputs.target_url }}
      TARGET_URL: ${{ inputs.target_url }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/chromium-results.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate deployment inputs
        working-directory: .
        run: |
          python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit

          target = os.environ["TARGET_URL"]
          candidate = os.environ["CANDIDATE_SHA"]
          parsed = urlsplit(target)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("target_url must be an HTTPS URL with a hostname")
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("target_url must not contain credentials, query, or fragment")
          if parsed.path not in ("", "/"):
              raise SystemExit("target_url pathname must be /")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", candidate):
              raise SystemExit("candidate_sha must be exactly 40 hexadecimal characters")
          origin = f"https://{parsed.netloc}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PLAYWRIGHT_BASE_URL={origin}\nTARGET_URL={origin}\n")
          PY
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || {
            echo "::error::candidate_sha does not match checked-out HEAD"
            exit 1
          }

      - name: Probe deployed target
        run: |
          timeout 45s bash -c 'until curl --connect-timeout 5 --max-time 10 -fsS -o /dev/null "$TARGET_URL"; do sleep 3; done' || {
            echo "::error::target_url did not become ready within 45 seconds"
            exit 1
          }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run full Chromium suite
        run: bunx playwright test --project=chromium

      - name: Upload Chromium Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-chromium-${{ inputs.candidate_sha }}
          path: web/playwright-report/
          retention-days: 30
          if-no-files-found: error

      - name: Upload Chromium test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-chromium-${{ inputs.candidate_sha }}
          path: web/test-results/
          retention-days: 30
          if-no-files-found: error

  webkit-iphone:
    name: Deployed target (WebKit iPhone)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_EXTERNAL_TARGET: "1"
      PLAYWRIGHT_BASE_URL: ${{ inputs.target_url }}
      TARGET_URL: ${{ inputs.target_url }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/webkit-iphone-results.json
      IOS_E2E: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate deployment inputs
        working-directory: .
        run: |
          python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit

          target = os.environ["TARGET_URL"]
          candidate = os.environ["CANDIDATE_SHA"]
          parsed = urlsplit(target)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("target_url must be an HTTPS URL with a hostname")
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("target_url must not contain credentials, query, or fragment")
          if parsed.path not in ("", "/"):
              raise SystemExit("target_url pathname must be /")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", candidate):
              raise SystemExit("candidate_sha must be exactly 40 hexadecimal characters")
          origin = f"https://{parsed.netloc}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PLAYWRIGHT_BASE_URL={origin}\nTARGET_URL={origin}\n")
          PY
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || {
            echo "::error::candidate_sha does not match checked-out HEAD"
            exit 1
          }

      - name: Probe deployed target
        run: |
          timeout 45s bash -c 'until curl --connect-timeout 5 --max-time 10 -fsS -o /dev/null "$TARGET_URL"; do sleep 3; done' || {
            echo "::error::target_url did not become ready within 45 seconds"
            exit 1
          }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install WebKit
        run: bunx playwright install --with-deps webkit

      - name: Run WebKit iPhone suite
        run: >-
          bunx playwright test
          tests/e2e/mobile-shell.spec.ts
          tests/e2e/landing.spec.ts
          tests/e2e/landing-reduced-motion.spec.ts
          tests/e2e/inner-pages.spec.ts
          --project=webkit-iphone
          --workers=1

      - name: Upload WebKit Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-webkit-iphone-${{ inputs.candidate_sha }}
          path: web/playwright-report/
          retention-days: 30
          if-no-files-found: error

      - name: Upload WebKit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-webkit-iphone-${{ inputs.candidate_sha }}
          path: web/test-results/
          retention-days: 30
          if-no-files-found: error
