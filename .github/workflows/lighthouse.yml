name: Lighthouse CI

# Gates Core Web Vitals on production-relevant routes. Runs against the
# deployed Vercel preview/production URL supplied via `target_url` input,
# rather than building Next locally — dev/build servers hide real bundling
# cost and inflate LCP/INP scores, and local builds can't reproduce the
# exact edge runtime + CDN configuration that production uses.
#
# Trigger: manual dispatch only. An operator provides the target Vercel
# URL and the candidate SHA it was built from, so the receipt is
# reproducible and pinpoints the exact deployment under test.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "https URL of the deployed Vercel target to audit"
        required: true
        type: string
      candidate_sha:
        description: "Git SHA the Vercel deployment was built from"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI (CLS · LCP · INP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: validate target
        working-directory: .
        env:
          INPUT_TARGET_URL: ${{ inputs.target_url }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");

          const candidateSha = process.env.INPUT_CANDIDATE_SHA;
          if (!/^[0-9a-f]{40}$/i.test(candidateSha)) {
            throw new Error("candidate_sha must be exactly 40 hexadecimal characters");
          }

          let target;
          try {
            target = new URL(process.env.INPUT_TARGET_URL);
          } catch {
            throw new Error("target_url must be a valid URL");
          }
          if (target.protocol !== "https:") throw new Error("target_url must use https:");
          if (!target.hostname) throw new Error("target_url must include a hostname");
          if (target.username || target.password) throw new Error("target_url must not include credentials");
          if (target.search || target.hash) throw new Error("target_url must not include a query or hash");
          if (target.pathname !== "/") throw new Error("target_url pathname must be /");

          const actualSha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (actualSha.toLowerCase() !== candidateSha.toLowerCase()) {
            throw new Error(`HEAD (${actualSha}) != candidate_sha (${candidateSha})`);
          }

          const targetUrl = target.origin;
          require("node:fs").appendFileSync(process.env.GITHUB_ENV, `TARGET_URL=${targetUrl}\nLHCI_BASE_URL=${targetUrl}\n`);
          NODE

      - name: probe deployed target
        working-directory: .
        run: curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 30 "$TARGET_URL/" > /dev/null

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: install
        run: bun install --frozen-lockfile

      - name: Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN || '' }}
        run: |
          bunx --bun lhci autorun \
            --collect.url="$TARGET_URL/" \
            --collect.url="$TARGET_URL/dashboard" \
            --collect.url="$TARGET_URL/asset/jitoSOL" \
            --collect.url="$TARGET_URL/methodology" \
            --collect.url="$TARGET_URL/audit" \
            --config=lighthouserc.json

      - name: upload lighthouse results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-results-${{ inputs.candidate_sha }}
          path: web/.lighthouseci/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
