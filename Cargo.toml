[workspace]
resolver = "2"
members = [
    "crates/api-rs",
    "crates/common",
    "crates/common-verify",
    "crates/dispatcher-rs",
    "crates/engine-rs",
    "crates/indexer-rs",
    "crates/methodology",
    "crates/pegana-replay-cli",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
authors = ["Pegana contributors"]
license = "MIT"
repository = "https://github.com/lrafasouza/pegana"

[workspace.dependencies]
# async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
rand = "0.8"

# error handling
anyhow = "1"
thiserror = "1"

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sentry = { version = "0.34", features = ["tracing"] }

# data
# `default-features = false` drops sqlx's defaults — ["any", "macros", "migrate", "json"].
# We use none of `any` (no AnyPool anywhere) and none of `migrate` (migrations are raw
# .sql applied out-of-band by `sqlx migrate run`, never the embedded macro); `json` and
# `macros` are re-listed below because they ARE used.
#
# NOTE FOR ANYONE REVISITING THIS: it does NOT remove a vulnerability. sqlx 0.8's
# defaults never included the mysql/sqlite drivers, so `rsa` (RUSTSEC-2023-0071) was
# already absent from the compiled graph — `cargo tree -p api-rs -i rsa` printed
# "nothing to print" BEFORE this change. The wins here are narrower: a smaller compile
# graph and fewer phantom lockfile entries on the `cargo audit` surface.
#
# `macros` is kept for `derive` (#[derive(sqlx::FromRow)], 4 call sites) — it expands to
# ["derive", "sqlx-macros/macros"]. The compile-time query!/query_as! macros are NOT used
# anywhere (this repo deliberately uses runtime `sqlx::query()` so builds need no DATABASE_URL).
# `bigdecimal` dropped: zero BigDecimal references in any crate — rust_decimal covers NUMERIC.
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "chrono", "rust_decimal", "uuid", "json"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
rust_decimal = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# http
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
eventsource-stream = "0.2"
url = "2.5"

# solana
# We only ever use the HTTP RPC client (`nonblocking::rpc_client::RpcClient`)
# and `client_error` — never pubsub, QUIC/TPU, or the websocket stack. Depending
# on `solana-rpc-client` (+ `-api`) instead of the monolithic `solana-client`
# keeps the EOL `rustls 0.21` / `tokio-rustls 0.24` / `tokio-tungstenite 0.20`
# line out of the compiled graph (it was reachable only via solana-client's
# pubsub deps, and rustls 0.21.12 is the final 0.21 release — no security
# patch). `quinn-proto` remains in the lock only as an unactivated optional
# `reqwest/http3` dep, so it is not compiled, though `cargo audit` still scans
# it — hence the explicit bump to a patched release.
solana-rpc-client = "2.0"
solana-rpc-client-api = "2.0"
solana-sdk = "2.0"
spl-token-2022 = "4"
spl-associated-token-account = "4"
borsh = "1"

# Note: tried integrating the upstream hylo-quotes / hylo-idl crates for
# native NAV decode, but their anchor 0.31 + pyth-solana-receiver-sdk 1.1
# dependency tree pulls a conflicting borsh that breaks our existing
# solana-client 2.0 setup. We instead derive Hylo's PDAs locally using
# solana_sdk::pubkey::Pubkey::find_program_address with the published
# seed bytes (see crates/indexer-rs/src/sources/hylo.rs).

# metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# config
config = { version = "0.14", features = ["toml"] }
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1   # faster sqlx compile-time check rebuilds

# cargo-dist binary release pipeline. Only `pegana-replay-cli` ships;
# every other workspace member is private (server binaries, indexer,
# dispatcher, etc.). Sigstore attestations are issued by GitHub OIDC
# via the attest-build-provenance action — no key material to rotate.
# Operator can refresh this block by re-running `dist init --yes`
# after merging.
[workspace.metadata.dist]
cargo-dist-version    = "0.30.0"
ci                    = ["github"]
# Homebrew installer is omitted for v0.1.0 (would require homepage/description
# on the workspace package — deferred until GA / public-repo cut).
installers            = ["shell", "powershell"]
# Workflow file is hand-rolled (kept under our review) rather than autogenerated
# by `dist init`. Tells dist to skip the "out of date" diff check on the .yml.
allow-dirty           = ["ci"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
hosting               = ["github"]
install-path          = "~/.pegana/bin"
publish-jobs          = []
github-attestations   = true   # Sigstore via GitHub OIDC

[workspace.metadata.dist.publish-binaries]
"pegana-replay" = ["pegana-replay"]
