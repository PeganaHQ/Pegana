[[assets]]
symbol         = "sUSDe"
name           = "Ethena Staked USDe"
mint           = "Eh6XEPhSwoLv5wFApukmnaVSHQ6sAnoD9BmgmwQoN2sN"
verified       = true    # mint confirmed via docs.ethena.fi + mainnet RPC; NAV source = Pyth SUSDE/USDE.RR
decimals       = 9       # 9 on Solana (Wormhole NTT bridged variant, matches USDe Solana pattern)
token_program  = "spl"
class          = "stable_yield"
peg_target     = "USD"
# Task 9 resolution: Ethena publishes the official sUSDe redemption rate
# (per-share NAV vs USDE) to Pyth as `Crypto.SUSDE/USDE.RR`. The feed is
# Ethena-attested on Ethereum — Hermes redistributes it cross-chain, so
# consuming it from Solana is equivalent to reading the source.
# Note: feed is USDE-quoted, not USD-quoted. USDE is Ethena's delta-neutral
# stablecoin that trades within ~1bp of $1; engine treats value as USD-denominated.
# Drift threshold (30bps) absorbs USDE/USD slippage comfortably.
# Same code path as USDY (Task 4) and syrupUSDC (Task 7) — no new adapter.
intrinsic      = { kind = "pyth_redemption_rate", feed = "SUSDE/USDE.RR" }
market         = { kind = "pyth_spot", feed = "SUSDE/USD" }   # Pyth spot price (USD-quoted secondary market).
pyth_feed_id   = "0xca3ba9a619a4b3755c10ac7d5e760275aa95e9823d38a84fedd416856cdba37c"
thresholds_bps = { drift = 30, depeg = 100, critical = 300 }
