[package]
name = "pegana-receiver"
version = "0.1.0"
edition = "2021"

# Keep this sample standalone — not part of the parent workspace.
[workspace]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = "2.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
