# Single-package "workspace": web/ is the only project. The `packages` field
# is required by pnpm 9+ even for a one-package layout — without it,
# `pnpm install --frozen-lockfile` fails with "packages field missing or empty",
# which was breaking the new CI `audit-web` job.
packages:
  - .

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Supply-chain hardening (react-doctor: require-pnpm-hardening). Delay installs
# of freshly-published versions so malware that gets caught + unpublished within
# hours never reaches the CI audit-web job. 10080 min = 7 days.
minimumReleaseAge: 10080
