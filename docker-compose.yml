# Container log rotation, applied to every service below. The daemon default
# on the box (/etc/docker/daemon.json: 10m x 3) kept only ~10h of engine logs
# during warning floods. 50m x 5 = up to 250 MB per container, still small
# against the 96 GB disk. Size-based, so a log flood cannot fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # postgres keeps only the capabilities its entrypoint needs to chown the data
  # directory and drop to the postgres user (CHOWN, SETUID, SETGID, FOWNER,
  # DAC_OVERRIDE). redis runs as root (its start command bypasses the image's
  # gosu step) on a /data volume owned by redis:redis 755, so it keeps only
  # DAC_OVERRIDE to write the append-only dir.
  postgres:
    logging: *default-logging
    mem_limit: 4g
    image: timescale/timescaledb:latest-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pegana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-pegana}
    volumes: [pgdata:/var/lib/postgresql/data]
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pegana}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    logging: *default-logging
    # Allows the configured 512 MiB data ceiling plus Redis process overhead.
    mem_limit: 640m
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    volumes: [redisdata:/data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    # Redis ACL users, generated at start from the environment into /tmp/users.acl
    # (passwords stored as SHA-256 hashes). `default` stays ON with the old password
    # (REDIS_PASSWORD) during the transition, so every service that still uses
    # redis://default:... or admin keeps working through any partial deploy; set
    # REDIS_DEFAULT_OFF=1 (an explicit later owner step) once all services run on
    # their own users. `admin` (REDIS_PASSWORD) has full access for operators, the
    # healthcheck and the local overlay. Each
    # service gets its own user when its REDIS_PASSWORD_<SERVICE> is set (written by
    # scripts/provision-service-credentials.sh together with <SERVICE>_REDIS_URL);
    # a service whose user is not provisioned yet connects as admin, so the cutover
    # is incremental. Per-user permissions are the exact commands, keys and
    # channels each service uses; a compromised container can no longer publish
    # engine inputs or discount frames.
    command:
      - sh
      - -c
      - |
        acl() {
          [ -n "$$2" ] || return 0
          printf 'user %s on #%s resetkeys resetchannels %s\n' "$$1" "$$(printf %s "$$2" | sha256sum | cut -d' ' -f1)" "$$3" >> /tmp/users.acl
        }
        : > /tmp/users.acl
        if [ "$$REDIS_DEFAULT_OFF" = 1 ]; then printf 'user default off\n' >> /tmp/users.acl; else acl default "$$REDIS_PASSWORD" '~* &* +@all'; fi
        acl admin "$$REDIS_PASSWORD" '~* &* +@all'
        acl indexer "$$REDIS_PASSWORD_INDEXER" '&pegana:src:* -@all +publish +ping'
        acl engine "$$REDIS_PASSWORD_ENGINE" '~pegana:alerts &pegana:discount &pegana:evidence_reconciled -@all +publish +xadd +ping (&pegana:src:* +subscribe)'
        acl dispatcher "$$REDIS_PASSWORD_DISPATCHER" '~pegana:alerts &pegana:evidence_reconciled -@all +subscribe +xgroup +xautoclaim +xreadgroup +xack +xpending +ping (~pegana:alerts:dlq +xadd)'
        acl api "$$REDIS_PASSWORD_API" '~v1:assets:list ~v1:assets:list:last-known-good ~v1:calibration:summary &pegana:discount -@all +subscribe +get +setex +ping'
        acl mcp "$$REDIS_PASSWORD_MCP" '&pegana:discount &pegana:alerts -@all +subscribe +unsubscribe +ping'
        chmod 600 /tmp/users.acl
        exec redis-server --aclfile /tmp/users.acl --save 60 1 --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      REDIS_DEFAULT_OFF: ${REDIS_DEFAULT_OFF:-}
      REDIS_PASSWORD_INDEXER: ${REDIS_PASSWORD_INDEXER:-}
      REDIS_PASSWORD_ENGINE: ${REDIS_PASSWORD_ENGINE:-}
      REDIS_PASSWORD_DISPATCHER: ${REDIS_PASSWORD_DISPATCHER:-}
      REDIS_PASSWORD_API: ${REDIS_PASSWORD_API:-}
      REDIS_PASSWORD_MCP: ${REDIS_PASSWORD_MCP:-}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --user admin ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Compose reads the root .env for interpolation only. Each service receives
  # an explicit allowlist, with DATABASE_URL / REDIS_URL rewritten to use the
  # in-network hostnames instead of the host-local development ports.

  indexer:
    logging: *default-logging
    mem_limit: 128m
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      dockerfile: crates/indexer-rs/Dockerfile
    environment:
      DATABASE_URL: ${INDEXER_DATABASE_URL:-postgres://${POSTGRES_USER:-pegana}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pegana}}
      REDIS_URL: ${INDEXER_REDIS_URL:-redis://admin:${REDIS_PASSWORD}@redis:6379}
      SANCTUM_API_URL: ${SANCTUM_API_URL:-https://extra-api.sanctum.so}
      JUPITER_API_URL: ${JUPITER_API_URL:-https://api.jup.ag}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      SOLANA_RPC_URL_FALLBACK: ${SOLANA_RPC_URL_FALLBACK:-https://solana-rpc.publicnode.com}
      ASSETS_FILE: ${ASSETS_FILE:-./assets.toml}
      JUPITER_MAX_CONCURRENT: ${JUPITER_MAX_CONCURRENT:-4}
      POLL_TICK_MS: ${POLL_TICK_MS:-2500}
      DARK_MARKET_GATE_ENABLED: ${DARK_MARKET_GATE_ENABLED:-false}
      DEXSCREENER_REQUIRE_CANONICAL_QUOTE: ${DEXSCREENER_REQUIRE_CANONICAL_QUOTE:-false}
      MARKET_SIZED_QUOTE_ENABLED: ${MARKET_SIZED_QUOTE_ENABLED:-false}
      SANCTUM_POLL_MS: ${SANCTUM_POLL_MS:-15000}
      HYLO_POLL_MS: ${HYLO_POLL_MS:-30000}
      SOLAYER_POLL_MS: ${SOLAYER_POLL_MS:-60000}
      PIGGYBANK_POLL_MS: ${PIGGYBANK_POLL_MS:-60000}
      SPL_STAKE_POOL_POLL_MS: ${SPL_STAKE_POOL_POLL_MS:-60000}
      PERENA_POLL_MS: ${PERENA_POLL_MS:-60000}
      TOKEN_SUPPLY_POLL_MS: ${TOKEN_SUPPLY_POLL_MS:-600000}
      FEATURE_HYLO: ${FEATURE_HYLO:-true}
      FEATURE_BRZ: ${FEATURE_BRZ:-true}
      FEATURE_SOLAYER: ${FEATURE_SOLAYER:-true}
      FEATURE_PIGGYBANK: ${FEATURE_PIGGYBANK:-true}
      FEATURE_SPL_STAKE_POOL: ${FEATURE_SPL_STAKE_POOL:-true}
      FEATURE_PERENA: ${FEATURE_PERENA:-true}
      FEATURE_TOKEN_SUPPLY: ${FEATURE_TOKEN_SUPPLY:-true}
      DB_MAX_CONNECTIONS: ${INDEXER_DB_MAX_CONNECTIONS:-15}
      DB_STATEMENT_TIMEOUT_MS: ${INDEXER_DB_STATEMENT_TIMEOUT_MS:-30000}
      DEXSCREENER_MAX_PREMIUM: ${DEXSCREENER_MAX_PREMIUM:-0.5}
      DEXSCREENER_MIN_LIQUIDITY_USD: ${DEXSCREENER_MIN_LIQUIDITY_USD:-25000}
      DEXSCREENER_POLL_MS: ${DEXSCREENER_POLL_MS:-30000}
      TOKENS_XYZ_API_KEY: ${TOKENS_XYZ_API_KEY:-}
      TOKENS_XYZ_POLL_MS: ${TOKENS_XYZ_POLL_MS:-60000}
      TOKENS_XYZ_RISK_POLL_MS: ${TOKENS_XYZ_RISK_POLL_MS:-1800000}
      PYTH_INTRINSIC_INTERVAL_MS: ${PYTH_INTRINSIC_INTERVAL_MS:-30000}
      PYTH_ONCHAIN_POLL_MS: ${PYTH_ONCHAIN_POLL_MS:-12000}
      PYTH_ONCHAIN_MAX_AGE_SECS: ${PYTH_ONCHAIN_MAX_AGE_SECS:-604800}
      # Free intrinsic sources. Empty ETH_RPC_URLS = the keyless public defaults.
      ETH_RPC_URLS: ${ETH_RPC_URLS:-}
      EVM_NAV_POLL_MS: ${EVM_NAV_POLL_MS:-60000}
      JUPITER_PERPS_POLL_MS: ${JUPITER_PERPS_POLL_MS:-15000}
      FX_HTTP_POLL_MS: ${FX_HTTP_POLL_MS:-60000}
      LST_DIRECTORY_POLL_MS: ${LST_DIRECTORY_POLL_MS:-900000}
      INTRINSIC_DIVERGENCE_TOLERANCE_BPS: ${INTRINSIC_DIVERGENCE_TOLERANCE_BPS:-300}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      METRICS_BIND: ${INDEXER_METRICS_BIND:-0.0.0.0:9090}
    volumes: [./assets.toml:/app/assets.toml:ro]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9094/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  engine:
    logging: *default-logging
    mem_limit: 64m
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      dockerfile: crates/engine-rs/Dockerfile
    environment:
      DATABASE_URL: ${ENGINE_DATABASE_URL:-postgres://${POSTGRES_USER:-pegana}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pegana}}
      REDIS_URL: ${ENGINE_REDIS_URL:-redis://admin:${REDIS_PASSWORD}@redis:6379}
      ASSETS_FILE: ${ASSETS_FILE:-./assets.toml}
      JUPITER_MAX_CONCURRENT: ${JUPITER_MAX_CONCURRENT:-4}
      POLL_TICK_MS: ${POLL_TICK_MS:-2500}
      DARK_MARKET_GATE_ENABLED: ${DARK_MARKET_GATE_ENABLED:-false}
      PYTH_STALENESS_SECS: ${PYTH_STALENESS_SECS:-30}
      PYTH_ONCHAIN_STALENESS_SECS: ${PYTH_ONCHAIN_STALENESS_SECS:-120}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      SOLANA_RPC_URL_FALLBACK: ${SOLANA_RPC_URL_FALLBACK:-https://solana-rpc.publicnode.com}
      PEGANA_COMMIT_KEYPAIR: ${PEGANA_COMMIT_KEYPAIR:-/opt/pegana/.secrets/commit-keypair.json}
      INTRINSIC_DROP_ALERT_BPS: ${INTRINSIC_DROP_ALERT_BPS:-0}
      INTRINSIC_DROP_WINDOW_SECS: ${INTRINSIC_DROP_WINDOW_SECS:-86400}
      PYTH_GATE_EXCLUDE_CANCELLED_NUMERAIRE: ${PYTH_GATE_EXCLUDE_CANCELLED_NUMERAIRE:-false}
      DEPTH_GATE_FLOOR_USD: ${DEPTH_GATE_FLOOR_USD:-0}
      DEPTH_GATE_FRESHNESS_SECS: ${DEPTH_GATE_FRESHNESS_SECS:-600}
      MARKET_REFERENCE_GATE_BPS: ${MARKET_REFERENCE_GATE_BPS:-0}
      PREMIUM_CONFIRMATION_GATE: ${PREMIUM_CONFIRMATION_GATE:-false}
      DEPTH_VERDICT_GATE: ${DEPTH_VERDICT_GATE:-false}
      INTRINSIC_LIVENESS_GATE: ${INTRINSIC_LIVENESS_GATE:-}
      INTRINSIC_LIVENESS_FRESHNESS_SECS: ${INTRINSIC_LIVENESS_FRESHNESS_SECS:-}
      DB_MAX_CONNECTIONS: ${ENGINE_DB_MAX_CONNECTIONS:-10}
      DB_STATEMENT_TIMEOUT_MS: ${ENGINE_DB_STATEMENT_TIMEOUT_MS:-30000}
      AUDIT_BASE_URL: ${AUDIT_BASE_URL:-https://pegana.xyz}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      METRICS_BIND: ${ENGINE_METRICS_BIND:-0.0.0.0:9091}
    volumes:
      - ./assets.toml:/app/assets.toml:ro
      - /opt/pegana/.secrets/commit-keypair.json:/opt/pegana/.secrets/commit-keypair.json:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9095/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  dispatcher:
    logging: *default-logging
    mem_limit: 64m
    # WS-B drains in-flight deliveries for 30s on SIGTERM; Docker's default 10s
    # would SIGKILL it mid-drain.
    stop_grace_period: 45s
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      dockerfile: crates/dispatcher-rs/Dockerfile
    environment:
      DATABASE_URL: ${DISPATCHER_DATABASE_URL:-postgres://${POSTGRES_USER:-pegana}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pegana}}
      REDIS_URL: ${DISPATCHER_REDIS_URL:-redis://admin:${REDIS_PASSWORD}@redis:6379}
      DB_MAX_CONNECTIONS: ${DISPATCHER_DB_MAX_CONNECTIONS:-20}
      DB_STATEMENT_TIMEOUT_MS: ${DISPATCHER_DB_STATEMENT_TIMEOUT_MS:-30000}
      PEGANA_WEBHOOK_SIGNING_KEY: ${PEGANA_WEBHOOK_SIGNING_KEY:-}
      PEGANA_WEBHOOK_SIGNING_KEY_NEXT: ${PEGANA_WEBHOOK_SIGNING_KEY_NEXT:-}
      # Public keys only; the dispatcher checks them against its signing seeds at startup.
      PEGANA_WEBHOOK_PUBKEYS_B64: ${PEGANA_WEBHOOK_PUBKEYS_B64:-}
      AUDIT_BASE_URL: ${AUDIT_BASE_URL:-https://pegana.xyz}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      METRICS_BIND: ${DISPATCHER_METRICS_BIND:-0.0.0.0:9093}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9096/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api:
    logging: *default-logging
    # mem_limit values must be validated against `docker stats` peak RSS (keep
    # at least 2x headroom) before rollout.
    mem_limit: 768m
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      dockerfile: crates/api-rs/Dockerfile
    environment:
      DATABASE_URL: ${API_DATABASE_URL:-postgres://${POSTGRES_USER:-pegana}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pegana}}
      REDIS_URL: ${API_REDIS_URL:-redis://admin:${REDIS_PASSWORD}@redis:6379}
      API_BIND: ${API_BIND:-0.0.0.0:8080}
      API_RATE_LIMIT_PER_MIN: ${API_RATE_LIMIT_PER_MIN:-60}
      PEGANA_WEB_SSR_TOKEN: ${PEGANA_WEB_SSR_TOKEN:-}
      PEGANA_WEB_SSR_RATE_LIMIT_PER_MIN: ${PEGANA_WEB_SSR_RATE_LIMIT_PER_MIN:-3000}
      PEGANA_WEB_SSR_EMBED_RATE_LIMIT_PER_MIN: ${PEGANA_WEB_SSR_EMBED_RATE_LIMIT_PER_MIN:-1500}
      # Peers allowed to set X-Forwarded-For (comma-separated CIDRs). Empty keeps
      # the code default (loopback + private ranges). See .env.example for how to
      # read the compose network's subnet and narrow it.
      PEGANA_TRUSTED_PROXIES: ${PEGANA_TRUSTED_PROXIES:-}
      FEATURE_PUBLIC_ALERTS: ${FEATURE_PUBLIC_ALERTS:-false}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      # The api holds public keys only; signing seeds stay in the dispatcher.
      PEGANA_WEBHOOK_PUBKEYS_B64: ${PEGANA_WEBHOOK_PUBKEYS_B64:-}
      PEGANA_WEBHOOK_EGRESS_IPS: ${PEGANA_WEBHOOK_EGRESS_IPS:-}
      DB_MAX_CONNECTIONS: ${API_DB_MAX_CONNECTIONS:-25}
      DB_STATEMENT_TIMEOUT_MS: ${API_DB_STATEMENT_TIMEOUT_MS:-30000}
      API_HOT_CACHE_ENABLED: ${API_HOT_CACHE_ENABLED:-true}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      METRICS_BIND: ${API_METRICS_BIND:-0.0.0.0:9092}
    # Docker's default soft nofile is 1024 (hard 524288). Every WebSocket and
    # every REST connection is an fd, so 1024 capped the api at roughly 500
    # live sockets before accept() failed with EMFILE for REST too. api-rs also
    # raises soft to hard at startup; WS_MAX_TOTAL (10k) keeps well inside this.
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  protocol-indexer:
    logging: *default-logging
    build: ./protocol-indexer-ts
    container_name: pegana-protocol-indexer
    restart: unless-stopped
    # Compensating controls for bigint-buffer advisory (CVE-2025-3194).
    # See docs/security/protocol-indexer-bigint-buffer-waiver.md.
    # 2026-10-16: raised 512m -> 1g on the Hostinger rebuild — bigint native
    # bindings failed to build in the new image (pure-JS fallback raises RSS);
    # revisit once `bun rebuild bigint` works in the image build.
    mem_limit: 1g
    mem_swappiness: 0
    pids_limit: 100
    cpus: "1.0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: ${PROTOCOL_INDEXER_DATABASE_URL:-postgres://${POSTGRES_USER:-pegana}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-pegana}}
      HTTP_PORT: "8091"
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      SOLANA_RPC_URL_FALLBACK: ${SOLANA_RPC_URL_FALLBACK:-https://solana-rpc.publicnode.com}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      KAMINO_API_URL: ${KAMINO_API_URL:-https://api.kamino.finance}
      KAMINO_MARKETS: ${KAMINO_MARKETS:-}
      KAMINO_POLL_MS: ${KAMINO_POLL_MS:-300000}
      # 3600000 (hourly), matching the source default. Credit budget estimate:
      # hourly ~= 1-2M Helius credits/month vs ~6.5-13M at 10 min (the 10-min
      # setting exhausted the allowance on 2026-08-02; see src/rpc-quota.ts).
      KAMINO_HF_POLL_MS: ${KAMINO_HF_POLL_MS:-3600000}
      KAMINO_HF_RESERVE_DELAY_MS: ${KAMINO_HF_RESERVE_DELAY_MS:-1500}
      JUPITER_LEND_API_URL: ${JUPITER_LEND_API_URL:-https://lite-api.jup.ag}
      JUPITER_LEND_POLL_MS: ${JUPITER_LEND_POLL_MS:-300000}
      JUPITER_HF_POLL_MS: ${JUPITER_HF_POLL_MS:-600000}
      JUPITER_HF_VAULT_DELAY_MS: ${JUPITER_HF_VAULT_DELAY_MS:-1200}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    expose: ["8091"]
    depends_on:
      postgres: { condition: service_healthy }
    # bun:1-slim has no curl — probe the Hono GET /health route via `bun -e
    # fetch` (same pattern as mcp-ts). Internal DB-writer, no Caddy route.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  mcp-ts:
    logging: *default-logging
    # See api: validate against `docker stats` peak RSS (>= 2x) before rollout.
    mem_limit: 512m
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build: ./mcp-ts
    container_name: pegana-mcp
    restart: unless-stopped
    environment:
      REDIS_URL: ${MCP_REDIS_URL:-redis://admin:${REDIS_PASSWORD}@redis:6379}
      DATABASE_URL: ${MCP_DATABASE_URL:-postgres://${POSTGRES_USER:-pegana}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-pegana}}
      # Every tool is free: no payment receiver and no facilitator credentials.
      SOLANA_NETWORK: ${SOLANA_NETWORK:-solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp}
      # Internal api-rs, not the public URL: through Caddy every MCP caller
      # shared the MCP container's one 60/min upstream bucket. mcp-ts forwards
      # each caller's IP as X-Forwarded-For (src/shared/upstream.ts), which
      # api-rs keys its limiter on. Public links use PEGANA_PUBLIC_API.
      PEGANA_API: ${MCP_PEGANA_API:-http://api:8080}
      PEGANA_PUBLIC_API: ${PEGANA_PUBLIC_API:-https://api.pegana.xyz}
      AUDIT_BASE_URL: ${AUDIT_BASE_URL:-https://pegana.xyz}
      HTTP_PORT: "8090"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      NODE_ENV: ${NODE_ENV:-production}
    # Same fd headroom as the api (Docker's default soft nofile is 1024).
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    expose: ["8090"]
    depends_on:
      redis: { condition: service_started }
      postgres: { condition: service_healthy }
    # The bun:1-slim runtime has no curl/wget, so the liveness probe uses
    # the same `bun -e fetch` pattern baked into mcp-ts/Dockerfile, hitting
    # the Hono GET /health route (returns "ok"). Mirrors the api service's
    # intent (HTTP 200 = healthy) with the toolchain this image actually has.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  caddy:
    logging: *default-logging
    init: true
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    image: pegana-caddy:2.11.7-rl-5625512
    build:
      context: .
      dockerfile: ops/caddy/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # No `user:` override: caddydata/caddyconfig hold root-owned certificates.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      # Same value the api and the web tier use. Empty/unset fails closed: the
      # Caddyfile then exempts no request from the edge rate limit.
      PEGANA_WEB_SSR_TOKEN: ${PEGANA_WEB_SSR_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Token and partner logos served at https://api.pegana.xyz/static/ (see
      # the api vhost in the Caddyfile). DIRECTORY mounts of the web app's own
      # public dirs, read-only: one copy of each file in the repo, and a
      # deploy's `git reset --hard` is visible without recreating caddy (a
      # single-file mount pins the old inode, see prometheus below).
      # web/ is proprietary and not in the public repository: on a public
      # checkout these mounts are empty (Docker creates the host dirs), so a
      # self-hosted stack answers 404 on /static. Put your own logos there.
      - ./web/public/tokens:/srv/static/tokens:ro
      - ./web/public/logos:/srv/static/logos:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      # Only the upstreams caddy actually proxies (api, mcp-ts) gate on health.
      api: { condition: service_healthy }
      mcp-ts: { condition: service_healthy }

  prometheus:
    logging: *default-logging
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # No host port mapping — the metrics surface stays on the internal docker
    # network. Grafana reaches it at http://prometheus:9090 via the docker
    # network. External access via Grafana only.
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # ⚠️ DIRECTORY mount, deliberately — NOT `./ops/alerts/pegana.yml:...`.
      # A single-FILE bind mount pins the host inode. `git reset --hard` (what
      # deploy.sh does) REPLACES the file rather than editing it in place, so
      # the container keeps serving the old inode forever and every alert-rule
      # change is silently ignored until the container is recreated.
      #
      # Caught live on 2026-08-10: host had inode 273473 / 37178 bytes while
      # the container was still reading inode 272060 / 30905 bytes from 6 days
      # earlier, and `promtool check rules` inside the container reported 32
      # rules against 37 on the host. Mounting the directory makes the file
      # resolve per-open, so a plain SIGHUP reload now picks changes up.
      #
      # `rule_files` still names pegana.yml explicitly (see ops/prometheus/
      # prometheus.yml) because this directory also holds pegana_test.yml,
      # which is a promtool UNIT-TEST file and is not loadable as rules.
      - ./ops/alerts:/etc/prometheus/rules:ro
      - prometheusdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      # Lifecycle endpoints (/-/quit, /-/reload) are disabled: enabled, they are
      # unauthenticated for every container on the network. Reload rules with
      # `docker compose kill -s SIGHUP prometheus`.
    # default: scrape targets. monitoring: the only network that reaches
    # alertmanager, which application containers do not join.
    networks: [default, monitoring]
    depends_on:
      api: { condition: service_started }

  # Alertmanager: routes the rules in ops/alerts/pegana.yml to Telegram and/or
  # Discord. Internal-only (no host port), reachable by Prometheus at
  # http://alertmanager:9093 over the dedicated `monitoring` network only: its
  # API has no authentication, so application containers do not join that
  # network.
  #
  # The config is rendered at start by ops/alertmanager/render-config.sh:
  #   - Telegram when ALERTMANAGER_TELEGRAM_BOT_TOKEN and a chat id
  #     (ALERTMANAGER_TELEGRAM_CHAT_ID, else DOGFOOD_TELEGRAM_CHAT_ID) are set;
  #   - Discord when ALERTMANAGER_DISCORD_WEBHOOK_URL is an https URL;
  #   - both when both are set;
  #   - otherwise ops/alertmanager/config-null.yml (a blackhole receiver) and a
  #     loud WARN in the container log. A failed render or a rendered file that
  #     fails `amtool check-config` also lands on the null config, so a missing
  #     or broken owner input never keeps Alertmanager down.
  #
  # The three secrets (Telegram token, Discord URL, dead-man URL) reach the container as `configs:` files (the top-level
  # `configs:` block at the end of this file), which compose copies into the
  # container at create time. They are never in the container env, in process args or in
  # `docker inspect`. The chat id is not a secret and is plain env.
  #
  # deploy.sh only recreates PEGANA_DEPLOY_SERVICES; bring this up once by hand
  # (`docker compose up -d alertmanager`) or list it in PEGANA_DEPLOY_SERVICES.
  # deploy.sh's post-deploy check fails when a long-running service has no
  # container.
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    logging: *default-logging
    restart: unless-stopped
    # Not read_only: compose refuses inline-content `configs` (the channel
    # secrets below) in a read-only service. Capabilities stay dropped.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [monitoring]
    volumes:
      - ./ops/alertmanager/render-config.sh:/etc/alertmanager/render-config.sh:ro
      - ./ops/alertmanager/config-null.yml:/etc/alertmanager/config-null.yml:ro
      - alertmanagerdata:/alertmanager
    # uid/gid 65534 is `nobody`, the image's user; 0400 keeps the files
    # readable by Alertmanager only. An unset variable yields a file holding
    # only a newline, which the render script reads as "channel not
    # configured" (see the top-level `configs:` block).
    configs:
      - source: alertmanager_telegram_bot_token
        target: /run/secrets/alertmanager_telegram_bot_token
        uid: "65534"
        gid: "65534"
        mode: 0400
      - source: alertmanager_discord_webhook_url
        target: /run/secrets/alertmanager_discord_webhook_url
        uid: "65534"
        gid: "65534"
        mode: 0400
      - source: alertmanager_deadman_url
        target: /run/secrets/alertmanager_deadman_url
        uid: "65534"
        gid: "65534"
        mode: 0400
    environment:
      ALERTMANAGER_TELEGRAM_CHAT_ID: ${ALERTMANAGER_TELEGRAM_CHAT_ID:-${DOGFOOD_TELEGRAM_CHAT_ID:-}}
    entrypoint:
      - /bin/sh
      - -c
      - |
        CONFIG=$$(/bin/sh /etc/alertmanager/render-config.sh /tmp/alertmanager-rendered) || CONFIG=""
        if [ -z "$$CONFIG" ] || [ ! -r "$$CONFIG" ]; then
          echo "WARN: alertmanager config render FAILED; starting with the null config. Alerts are NOT delivered anywhere." >&2
          CONFIG=/etc/alertmanager/config-null.yml
        fi
        exec /bin/alertmanager --config.file="$$CONFIG" --storage.path=/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      prometheus: { condition: service_started }

  # node-exporter serves backup textfile metrics and host filesystem capacity.
  # Internal-only. ${HOME} is the deploy user's home (compose runs as deploy);
  # install-pg-backup.sh creates the directory. create_host_path: false so a
  # missing dir fails loudly instead of docker creating a root-owned one.
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    logging: *default-logging
    restart: unless-stopped
    pid: host
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/textfile
      - --collector.filesystem
      - --path.rootfs=/host
      - --web.listen-address=:9100
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: ${PEGANA_METRICS_DIR:-${HOME}/.pegana-metrics}
        target: /textfile
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Grafana — visual layer for Prometheus metrics. NOT public: the
  # grafana.pegana.xyz vhost was removed from the Caddyfile (its DNS points at
  # Vercel, so Caddy failed ACME for it on every retry and it never served).
  # The port is bound to the box's loopback only; reach it with an SSH tunnel:
  #   ssh -L 3000:127.0.0.1:3000 deploy@<box>   then open http://localhost:3000
  # Dashboard JSON + Prometheus datasource provisioned via ./ops/grafana/.
  # Admin password from .env (GRAFANA_ADMIN_PASSWORD).
  grafana:
    logging: *default-logging
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_LOG_MODE: console
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboard.json:/var/lib/grafana/dashboards/pegana-overview.json:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      prometheus: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  monitoring: {}

volumes:
  pgdata: {}
  redisdata: {}
  caddydata: {}
  caddyconfig: {}
  prometheusdata: {}
  grafanadata: {}
  alertmanagerdata: {}

# Alertmanager channel secrets, copied into the alertmanager container as
# files (see that service). The trailing "\n" is load-bearing: compose treats
# an EMPTY `content` as "no inline content" and falls back to a bind mount with
# an empty source, which fails container create. With it, an unset variable
# yields a file holding only a newline, which the render script reads as
# "channel not configured" (Alertmanager trims whitespace from both files).
configs:
  alertmanager_telegram_bot_token:
    content: "${ALERTMANAGER_TELEGRAM_BOT_TOKEN:-}\n"
  alertmanager_discord_webhook_url:
    content: "${ALERTMANAGER_DISCORD_WEBHOOK_URL:-}\n"
  alertmanager_deadman_url:
    content: "${ALERTMANAGER_DEADMAN_URL:-}\n"
