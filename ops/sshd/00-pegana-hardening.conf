# /etc/ssh/sshd_config.d/00-pegana-hardening.conf
#
# Key-only SSH for the Pegana prod box. Installed by hand (root), following
# docs/runbooks/ssh-hardening.md. Not deployed by deploy.sh.
#
# Why the 00- prefix: Ubuntu 24.04's /etc/ssh/sshd_config includes
# sshd_config.d/*.conf at the TOP, and for each keyword sshd keeps the FIRST
# value it reads. Cloud images can ship 50-cloud-init.conf with
# "PasswordAuthentication yes", which would win over any later file.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
# Root may still log in with a key (avoids locking out a key-based root
# workflow); never with a password.
PermitRootLogin prohibit-password
PubkeyAuthentication yes
# 6 (not 3): the ssh client offers every key in the agent before the right one,
# and each offered key counts as an attempt, so 3 can lock out a legitimate
# user with a few keys loaded. Passwords are off, so guessing is not the risk.
MaxAuthTries 6
LoginGraceTime 30
