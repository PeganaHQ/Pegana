# promtool unit tests for ops/alerts/pegana.yml.
#
# Run with: promtool test rules ops/alerts/pegana_test.yml
#
# Covers PeganaAssetMiscalibrated, the api-rs periodic export of
# the /v1/calibration self-monitor (pegana_calibration_health_code) turned
# into a paging alert, plus the rules tested further down. See the group comment in pegana.yml for the code
# mapping (ok=0, watch=1, miscalibrated=2, no_data=-1, na=-2, inactive=-3).

rule_files:
  - pegana.yml

evaluation_interval: 1m

tests:
  # code=2 (miscalibrated) held for the full `for: 30m` window fires.
  - interval: 1m
    input_series:
      - series: 'pegana_calibration_health_code{asset="hyUSD"}'
        values: "2x35"
    alert_rule_test:
      - eval_time: 30m
        alertname: PeganaAssetMiscalibrated
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
              asset: hyUSD
            exp_annotations:
              summary: "hyUSD calibration is broken (p95 beyond depeg band)"
              description: |
                `pegana_calibration_health_code{asset="hyUSD"} >= 2` for
                30m — the trailing-8d p95 of hyUSD's effective discount
                is beyond its own depeg_bps band (see GET /v1/calibration). Either the
                asset is genuinely depegged (check the live verdict/alerts first) or
                its thresholds_bps are miscalibrated for its normal trading range.
                Cross-check pegana_calibration_p95_bps{asset="hyUSD"}
                against the asset's depeg_bps in assets.toml.

  # code=2 held for only 10m — hasn't cleared `for: 30m` yet, must NOT fire.
  - interval: 1m
    input_series:
      - series: 'pegana_calibration_health_code{asset="hyUSD"}'
        values: "2x11"
    alert_rule_test:
      - eval_time: 10m
        alertname: PeganaAssetMiscalibrated
        exp_alerts: []

  # code=1 (watch) sustained — below the >= 2 threshold, must NOT fire even
  # well past 30m.
  - interval: 1m
    input_series:
      - series: 'pegana_calibration_health_code{asset="INF"}'
        values: "1x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: PeganaAssetMiscalibrated
        exp_alerts: []

  # code=0 (ok) sustained — must NOT fire.
  - interval: 1m
    input_series:
      - series: 'pegana_calibration_health_code{asset="USDC"}'
        values: "0x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: PeganaAssetMiscalibrated
        exp_alerts: []

  # code=-1 (no_data, dark source) sustained — must NOT fire.
  - interval: 1m
    input_series:
      - series: 'pegana_calibration_health_code{asset="USDu"}'
        values: "-1x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: PeganaAssetMiscalibrated
        exp_alerts: []

  # code=-3 (CALIBRATION_HEALTH_INACTIVE) — an asset that dropped out of the
  # active set (deactivated); the api-rs task resets its gauge to -3 so a
  # previously-miscalibrated (=2) retired asset stops paging instead of firing
  # forever. Below >= 2, must NOT fire.
  - interval: 1m
    input_series:
      - series: 'pegana_calibration_health_code{asset="DEAD"}'
        values: "-3x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: PeganaAssetMiscalibrated
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="pegana-api",instance="api:9092",service="api"}'
        values: "0x7"
    alert_rule_test:
      - eval_time: 4m
        alertname: PeganaScrapeTargetDown
        exp_alerts: []
      - eval_time: 5m
        alertname: PeganaScrapeTargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: pegana-api
              instance: api:9092
              service: api
            exp_annotations:
              summary: "Prometheus scrape target down: pegana-api api:9092"
              description: |
                `up{job="pegana-api",instance="api:9092"} == 0` for 5m.
                Prometheus cannot scrape this target; inspect the container,
                network, and metrics endpoint.

  - interval: 1m
    input_series:
      - series: 'pegana_protocol_source_task_up{source="kamino"}'
        values: "0x7"
    alert_rule_test:
      - eval_time: 5m
        alertname: PeganaProtocolSourceTaskDown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: protocol-indexer
              source: kamino
            exp_annotations:
              summary: "Protocol indexer source task down: kamino"
              description: |
                `pegana_protocol_source_task_up{source="kamino"} == 0` for 5m.
                The source loop exited or failed to start; inspect protocol-indexer logs.

  - interval: 1m
    input_series:
      - series: 'pegana_protocol_source_last_publish_timestamp{source="jupiter_lend"}'
        values: "0x13"
    alert_rule_test:
      - eval_time: 11m
        alertname: PeganaProtocolSourceStale
        exp_alerts:
          - exp_labels:
              severity: warning
              service: protocol-indexer
              source: jupiter_lend
            exp_annotations:
              summary: "Protocol indexer source stale: jupiter_lend"
              description: |
                `time() - pegana_protocol_source_last_publish_timestamp{source="jupiter_lend"} > 300`
                for 5m. No successful fetch + upsert has completed recently; inspect the
                source upstream, RPC, database, and protocol-indexer logs.

  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="discord",receiver="discord-critical"}'
        values: "0 0 1 1 1 1"
    alert_rule_test:
      - eval_time: 3m
        alertname: PeganaAlertmanagerNotificationFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              service: alertmanager
              integration: discord
              receiver: discord-critical
            exp_annotations:
              summary: "Alertmanager notification delivery failing"
              description: |
                `increase(alertmanager_notifications_failed_total[5m]) > 0`.
                Alertmanager failed to deliver at least one notification; inspect its logs
                (the `integration` label says telegram or discord), the channel inputs
                (ALERTMANAGER_TELEGRAM_BOT_TOKEN / ALERTMANAGER_TELEGRAM_CHAT_ID, or
                ALERTMANAGER_DISCORD_WEBHOOK_URL), and network reachability. This alert
                may not get through while delivery is broken: check the Prometheus alerts
                page or `docker compose logs alertmanager`.

  # ── pegana.backups + PeganaDeadAssets baseline (r1-ops) ──
  - interval: 1m
    input_series:
    - series: pegana_backup_local_last_success_timestamp_seconds
      values: '0x600'
    - series: pegana_backup_offsite_last_success_timestamp_seconds
      values: '0x600'
    - series: pegana_backup_offsite_enabled
      values: 1x600
    - series: pegana_backup_last_exit_code
      values: 4x600
    - series: pegana_backup_last_run_timestamp_seconds
      values: 0+60x600
    alert_rule_test:
    - eval_time: 9h
      alertname: PeganaBackupLocalStale
      exp_alerts:
      - exp_labels:
          severity: critical
          service: backup
        exp_annotations:
          summary: No verified Postgres backup in the last 8h
          description: '`time() - pegana_backup_local_last_success_timestamp_seconds > 8h`.

            pg-backup.sh has not produced a verified local dump (cron runs every

            6h). Check `tail -50 ~/.pg-backup.log` and

            `~/.pegana-metrics/pegana_backup.prom` (pegana_backup_last_exit_code:

            2 config, 3 dump/verify, 5 disk). See the private restore runbook.

            '
    - eval_time: 9h
      alertname: PeganaBackupOffsiteStale
      exp_alerts:
      - exp_labels:
          severity: warning
          service: backup
        exp_annotations:
          summary: No backup has reached R2 in the last 8h (local copies only)
          description: '`time() - pegana_backup_offsite_last_success_timestamp_seconds > 8h`

            with offsite enabled. Local copies in ~/backups are being kept, but

            losing the box would lose the data. Usual cause: the R2 token behind

            the `r2:` rclone remote lacks Object Read & Write (403 AccessDenied

            in ~/.pg-backup.log).

            '
    - eval_time: 9h
      alertname: PeganaBackupLastRunFailed
      exp_alerts:
      - exp_labels:
          severity: warning
          service: backup
        exp_annotations:
          summary: Last pg-backup.sh run failed (exit 4)
          description: '`pegana_backup_last_exit_code != 0`. Exit 4 = verified local copy

            kept but the R2 upload failed; 3 = dump or verification failed;

            2 = configuration; 5 = not enough disk. Check ~/.pg-backup.log.

            '
    - eval_time: 9h
      alertname: PeganaBackupNotRunning
      exp_alerts: []
  - interval: 1m
    input_series:
    - series: pegana_backup_local_last_success_timestamp_seconds
      values: 0+60x600
    - series: pegana_backup_offsite_last_success_timestamp_seconds
      values: '0x600'
    - series: pegana_backup_offsite_enabled
      values: '0x600'
    - series: pegana_backup_last_exit_code
      values: '0x600'
    - series: pegana_backup_last_run_timestamp_seconds
      values: 0+60x600
    alert_rule_test:
    - eval_time: 9h
      alertname: PeganaBackupLocalStale
      exp_alerts: []
    - eval_time: 9h
      alertname: PeganaBackupOffsiteStale
      exp_alerts: []
    - eval_time: 9h
      alertname: PeganaBackupLastRunFailed
      exp_alerts: []
    - eval_time: 9h
      alertname: PeganaBackupNotRunning
      exp_alerts: []
  - interval: 1m
    input_series:
    - series: up{job="prometheus-self"}
      values: 1x60
    alert_rule_test:
    - eval_time: 45m
      alertname: PeganaBackupNotRunning
      exp_alerts:
      - exp_labels:
          severity: warning
          service: backup
        exp_annotations:
          summary: pg-backup.sh has not run in 7h, or its metrics are missing
          description: 'No pg-backup.sh run finished in the last 7h (cron is every 6h), or

            the textfile metric is absent (cron entry missing, ~/.pegana-metrics

            not mounted into node-exporter, or node-exporter down). Check

            `crontab -l | grep pg-backup` and `docker compose ps node-exporter`.

            '
  - interval: 1m
    input_series:
    - series: pegana_engine_dead_assets{service="engine"}
      values: 10x120 67 67 10x60 11x30
    alert_rule_test:
    - eval_time: 120m
      alertname: PeganaDeadAssets
      exp_alerts: []
    - eval_time: 150m
      alertname: PeganaDeadAssets
      exp_alerts: []
    - eval_time: 200m
      alertname: PeganaDeadAssets
      exp_alerts:
      - exp_labels:
          severity: warning
          service: engine
        exp_annotations:
          summary: 11 active assets are not publishing, more than the 7-day baseline
          description: '`pegana_engine_dead_assets > min_over_time(pegana_engine_dead_assets[7d])`

            for >15m. At least one active asset that published during the last

            7 days has not published since the engine started. The known

            never-publishing (UNKNOWN by design) set is the baseline and does

            not fire this. Find the newcomer in the engine `H12b freshness

            sweep` log line (`dead=` list) and compare with the previous list.

            '

  # Shared WS fan-out: disconnected for the full 2m window fires.
  - interval: 30s
    input_series:
      - series: 'pegana_ws_fanout_connected{service="api"}'
        values: "1 0x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: PeganaWsFanoutDisconnected
        exp_alerts: []
      - eval_time: 5m
        alertname: PeganaWsFanoutDisconnected
        exp_alerts:
          - exp_labels:
              severity: critical
              service: api
            exp_annotations:
              summary: "API WebSocket fan-out is disconnected from Redis"
              description: |
                `pegana_ws_fanout_connected == 0` for 2m. The shared Redis
                subscription that feeds /v1/ws is down, so live frames are not
                reaching clients. Check the api logs for the fan-out reconnect loop
                and Redis health.

  # Fan-out stalls: the counter climbs by 1 per minute, so by 10m the 15m
  # increase is above 3 and the rule fires; at 3m only ~3 or fewer stalls are
  # in the window (3 is not > 3), so it must not.
  - interval: 1m
    input_series:
      - series: 'pegana_ws_fanout_stalls_total{service="api"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 3m
        alertname: PeganaWsFanoutStalling
        exp_alerts: []
      - eval_time: 10m
        alertname: PeganaWsFanoutStalling
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
            exp_annotations:
              summary: "API WebSocket fan-out stalled more than 3 times in 15m"
              description: |
                `increase(pegana_ws_fanout_stalls_total[15m]) > 3`. The shared
                fan-out keeps stalling and reconnecting: its Redis subscription was
                silent for 30s each time. Either the engine heartbeat (every 5s) is
                absent, or Redis is wedged. Check the engine is publishing, the api
                logs for "stall" lines, and Redis health.

  # fd usage: 90% held past 5m fires; 50% does not.
  - interval: 1m
    input_series:
      - series: 'pegana_api_open_fds{service="api"}'
        values: "900x10"
      - series: 'pegana_api_fd_limit{service="api"}'
        values: "1000x10"
      - series: 'pegana_api_open_fds{service="low"}'
        values: "500x10"
      - series: 'pegana_api_fd_limit{service="low"}'
        values: "1000x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: PeganaApiFdsNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
            exp_annotations:
              summary: "API process is using more than 80% of its file descriptor limit"
              description: |
                `pegana_api_open_fds / pegana_api_fd_limit > 0.8` for 5m. The api
                is approaching EMFILE; new connections will fail once the soft
                limit is hit. Look for a connection or socket leak, then raise the
                container nofile limit if the load is legitimate.

  # NAV-sanity UNKNOWN: a counter that keeps rising fires only after the
  # `for: 15m` hold; a single bump does not page.
  - interval: 1m
    input_series:
      - series: 'pegana_engine_nav_sanity_unknown_total{service="engine"}'
        values: "0+1x40"
      - series: 'pegana_engine_nav_sanity_unknown_total{service="engine",asset="once"}'
        values: "0 1 1x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: PeganaNavSanityUnknownSpike
        exp_alerts: []
      - eval_time: 20m
        alertname: PeganaNavSanityUnknownSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              service: engine
            exp_annotations:
              summary: "NAV-sanity forced an asset to UNKNOWN"
              description: |
                `increase(pegana_engine_nav_sanity_unknown_total[15m]) > 0` for
                15m. The methodology caught a broken NAV anchor (sHYUSD-class);
                expected occasionally, investigate if sustained.

  # fx_http forex-weekend exemption. promtool time 0 is 1970-01-01 00:00 UTC, a
  # THURSDAY, so: Fri 20:30 = 44h30m, Sat 12:00 = 60h, Sun 22:30 = 94h30m (the
  # 5-minute reopen grace ends at 94h35m), Mon 08:00 = 104h. The gauge is stuck
  # at 0 (last publish at time 0), so the publish age equals eval_time.
  - interval: 1m
    input_series:
      - series: 'pegana_source_last_publish_timestamp{source="fx_http"}'
        values: "0x6300"
    alert_rule_test:
      # Weekday: a stuck fx_http fires on its own rule...
      - eval_time: 10m
        alertname: PeganaFxSourceNotPublishing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: indexer
              source: fx_http
            exp_annotations:
              summary: "Ingestion source fx_http stopped publishing while FX is open"
              description: |
                No successful publish from source=fx_http for
                10m 0s (threshold 5m, sustained 2m) outside the
                forex-closed weekend (Fri 20:30 to Sun 22:30 UTC). EURC's intrinsic will
                go stale. Either a venue (Kraken / Coinbase) is down, the two venues
                disagree by more than max_divergence_bps, or the task died. Check the
                indexer logs (`fx_http poll failed`) and
                `pegana_fx_http_polls_total{status}`.
      # ...and never through the generic per-source rule.
      - eval_time: 10m
        alertname: PeganaSourceNotPublishing
        exp_alerts: []
      # Friday one minute before the close: still open, still firing.
      - eval_time: 44h29m
        alertname: PeganaFxSourceNotPublishing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: indexer
              source: fx_http
            exp_annotations:
              summary: "Ingestion source fx_http stopped publishing while FX is open"
              description: |
                No successful publish from source=fx_http for
                1d 20h 29m 0s (threshold 5m, sustained 2m) outside the
                forex-closed weekend (Fri 20:30 to Sun 22:30 UTC). EURC's intrinsic will
                go stale. Either a venue (Kraken / Coinbase) is down, the two venues
                disagree by more than max_divergence_bps, or the task died. Check the
                indexer logs (`fx_http poll failed`) and
                `pegana_fx_http_polls_total{status}`.
      # Friday after 20:30, Saturday, Sunday before the reopen: suppressed.
      - eval_time: 44h31m
        alertname: PeganaFxSourceNotPublishing
        exp_alerts: []
      - eval_time: 60h
        alertname: PeganaFxSourceNotPublishing
        exp_alerts: []
      - eval_time: 94h29m
        alertname: PeganaFxSourceNotPublishing
        exp_alerts: []
      # Sunday inside the 5-minute reopen grace: still suppressed.
      - eval_time: 94h36m
        alertname: PeganaFxSourceNotPublishing
        exp_alerts: []
      # Sunday 22:40, gauge still stale past the grace + `for: 2m`: fires.
      - eval_time: 94h40m
        alertname: PeganaFxSourceNotPublishing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: indexer
              source: fx_http
            exp_annotations:
              summary: "Ingestion source fx_http stopped publishing while FX is open"
              description: |
                No successful publish from source=fx_http for
                3d 22h 40m 0s (threshold 5m, sustained 2m) outside the
                forex-closed weekend (Fri 20:30 to Sun 22:30 UTC). EURC's intrinsic will
                go stale. Either a venue (Kraken / Coinbase) is down, the two venues
                disagree by more than max_divergence_bps, or the task died. Check the
                indexer logs (`fx_http poll failed`) and
                `pegana_fx_http_polls_total{status}`.
      # Monday, still stale: fires.
      - eval_time: 104h
        alertname: PeganaFxSourceNotPublishing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: indexer
              source: fx_http
            exp_annotations:
              summary: "Ingestion source fx_http stopped publishing while FX is open"
              description: |
                No successful publish from source=fx_http for
                4d 8h 0m 0s (threshold 5m, sustained 2m) outside the
                forex-closed weekend (Fri 20:30 to Sun 22:30 UTC). EURC's intrinsic will
                go stale. Either a venue (Kraken / Coinbase) is down, the two venues
                disagree by more than max_divergence_bps, or the task died. Check the
                indexer logs (`fx_http poll failed`) and
                `pegana_fx_http_polls_total{status}`.

  # fx_http publishing every minute on a weekday stays quiet, and the generic
  # rule still covers every other source.
  - interval: 1m
    input_series:
      - series: 'pegana_source_last_publish_timestamp{source="fx_http"}'
        values: "0+60x20"
      - series: 'pegana_source_last_publish_timestamp{source="evm_nav"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: PeganaFxSourceNotPublishing
        exp_alerts: []
      - eval_time: 10m
        alertname: PeganaSourceNotPublishing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: indexer
              source: evm_nav
            exp_annotations:
              summary: "Ingestion source evm_nav stopped publishing"
              description: |
                No successful publish from source=evm_nav for
                10m 0s (threshold 5m, sustained 2m). Assets fed
                by it will go stale; the engine-side PeganaDeadAssets only fires at 15m,
                so this is the early per-source signal. Check the indexer logs + the
                source's upstream.
