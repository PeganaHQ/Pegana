# Pegana — Prometheus scrape + rule config.
#
# Loaded by the compose `prometheus` service. Containers in the same compose
# network resolve by service name (indexer:9090, engine:9091, api:9092,
# dispatcher:9093). The metrics endpoints are unauthenticated and bound on
# the internal docker network only — never expose to the host without ufw.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    env: production
    site: pegana

rule_files:
  - /etc/prometheus/rules/pegana.yml

# Route fired rules to Alertmanager (internal-only service; resolves on the
# docker network). Alertmanager posts to Telegram and/or Discord; see
# ops/alertmanager/render-config.sh.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]
        labels: { service: prometheus }

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels: { service: alertmanager }

  # Host-side cron metrics (scripts/pg-backup.sh -> ~/.pegana-metrics), served
  # by the textfile-only node-exporter service.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { service: backup }

  - job_name: pegana-indexer
    metrics_path: /metrics
    static_configs:
      - targets: ["indexer:9090"]
        labels: { service: indexer }

  - job_name: pegana-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["engine:9091"]
        labels: { service: engine }

  - job_name: pegana-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9092"]
        labels: { service: api }

  - job_name: pegana-dispatcher
    metrics_path: /metrics
    static_configs:
      - targets: ["dispatcher:9093"]
        labels: { service: dispatcher }

  - job_name: "pegana-protocol-indexer"
    metrics_path: /metrics
    static_configs:
      - targets: ["protocol-indexer:8091"]
        labels: { service: protocol-indexer }

  # Hosted MCP server (every tool is free). Exposes
  # pegana_mcp_tool_calls_total and pegana_mcp_tool_latency_seconds.
  - job_name: pegana-mcp-ts
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp-ts:8090"]
        labels: { service: mcp-ts }
