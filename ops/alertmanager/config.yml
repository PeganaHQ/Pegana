# Pegana — Alertmanager routing config.
#
# Routes the Prometheus rules in ops/alerts/pegana.yml (severity=critical →
# page, severity=warning → low-priority) to Telegram. Internal-only — Prometheus
# reaches it at http://alertmanager:9093 over the docker network; no host port.
#
# ─── SECRETS / RENDERING ─────────────────────────────────────────────────────
# Alertmanager does NOT expand ${VAR} at load AND it strictly validates the
# config at boot (chat_id is int64) — a raw ${...} crash-loops the container.
# So this file is a TEMPLATE: the `alertmanager` service in docker-compose.yml
# renders it with `sed` at startup, substituting __BOT_TOKEN__ / __CHAT_ID__
# from .env (ALERTMANAGER_TELEGRAM_BOT_TOKEN / ALERTMANAGER_TELEGRAM_CHAT_ID)
# into /tmp/alertmanager.yml, then launches alertmanager against that.
#
# Both values are required by the production entrypoint, so a missing credential
# aborts container startup instead of silently rendering an inert receiver. The
# local compose overlay explicitly supplies isolated inert values for smoke tests.
#
# Required env (already in .env.example):
#   ALERTMANAGER_TELEGRAM_BOT_TOKEN  — token for the ops channel. Use a
#                                      DEDICATED ops bot so infra paging keeps
#                                      its own rate-limit budget.
#   ALERTMANAGER_TELEGRAM_CHAT_ID    — integer chat id for the ops group.
# (The token only ever lives in .env on the host — same trust boundary as every
# other secret here — so rendering it in-container adds no exposure beyond what
# `cat .env` already grants.)
# ─────────────────────────────────────────────────────────────────────────────

global:
  resolve_timeout: 5m

route:
  receiver: telegram-warning
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical → page. Tighter repeat so an ongoing incident keeps nagging.
    - matchers:
        - severity = critical
      receiver: telegram-critical
      group_wait: 10s
      repeat_interval: 30m

receivers:
  - name: telegram-critical
    telegram_configs:
      - bot_token: '__BOT_TOKEN__'
        chat_id: __CHAT_ID__
        api_url: https://api.telegram.org
        parse_mode: HTML
        send_resolved: true
        message: |
          🔴 <b>[CRITICAL] {{ .CommonLabels.alertname }}</b>
          service: {{ .CommonLabels.service }}
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}

  - name: telegram-warning
    telegram_configs:
      - bot_token: '__BOT_TOKEN__'
        chat_id: __CHAT_ID__
        api_url: https://api.telegram.org
        parse_mode: HTML
        send_resolved: true
        message: |
          🟡 <b>[warning] {{ .CommonLabels.alertname }}</b>
          service: {{ .CommonLabels.service }}
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}

inhibit_rules:
  # While a critical for a service is firing, suppress its warnings — the
  # page already has on-call's attention; the warnings are just noise.
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['alertname', 'service']
